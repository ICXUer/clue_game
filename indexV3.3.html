<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{max-width:700px;margin:10px auto;padding:10px;background:#fff;font-size:15px;}
.card{border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0;}
.card.selected{background:#e8f4ff;border-color:#2b7cd3;}
img{max-width:240px;max-height:220px;border-radius:4px;}
button{padding:8px 12px;margin:4px;border:none;border-radius:6px;background:#2b7cd3;color:#fff;font-size:14px;}
button.danger{background:#dc3545;}
button.gray{background:#888;}
textarea,input,select{width:100%;padding:8px;margin:4px 0;border:1px solid #aaa;border-radius:4px;font-size:15px;}
.section{margin:16px 0;padding:12px;border:1px solid #ddd;border-radius:8px;}
.tip{color:#666;font-size:14px;}
.belong-tag{display:inline-block;background:#f0f0f0;padding:3px 6px;border-radius:4px;font-size:13px;margin:2px;}
.group-box{border:2px solid #ddd;border-radius:10px;padding:10px;margin:12px 0;}
.group-box.timeplace{border-color:#2b7cd3;background:#f7fbff;}
.group-box.rumor{border-color:#e6a23c;background:#fffbf5;}
.group-box.deep{border-color:#7b4ecb;background:#faf7ff;}
.group-box h4{margin:0 0 8px;font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.group-box h4 > span{white-space:nowrap;}
.group-box h4 .badge{margin-left:auto;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:13px;background:#2b7cd3;color:#fff;font-weight:normal;}
.badge.warn{background:#e6a23c;}
.badge.full{background:#dc3545;}
.badge.deep-badge{background:#7b4ecb;}
</style>

<script>
const STORAGE_KEY = "clue_game_data";
const LAST_ROOM_KEY = "clue_last_room";
const PLAYER_ROLE_KEY = "clue_player_role";
const CLIENT_ID_KEY = "clue_client_id";
const DATA_VERSION = "v5_group";

// 本机唯一标识，用来判断是不是同一台设备在控场
const CLIENT_ID = (function(){
  try{
    let id = localStorage.getItem(CLIENT_ID_KEY);
    if(!id){ id = uuid(); localStorage.setItem(CLIENT_ID_KEY, id); }
    return id;
  }catch(e){ return uuid(); }
})();

function rememberRoom(role){
  try{
    localStorage.setItem(LAST_ROOM_KEY, JSON.stringify({code: roomCode, role: role, at: Date.now()}));
  }catch(e){}
}
function getLastRoom(){
  try{
    const raw = localStorage.getItem(LAST_ROOM_KEY);
    if(!raw) return null;
    const r = JSON.parse(raw);
    return (r && r.code) ? r : null;
  }catch(e){ return null; }
}
function savePlayerRole(role){
  try{ localStorage.setItem(PLAYER_ROLE_KEY, role || ""); }catch(e){}
}
function getPlayerRole(){
  try{ return localStorage.getItem(PLAYER_ROLE_KEY) || ""; }catch(e){ return ""; }
}
function genRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 去掉了易看错的 0/1/I/O
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  let code = letters.charAt(Math.floor(Math.random() * letters.length));
  for(let i = 1; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}

// 基础线索 -> 可发放的深入线索 对应关系（依牌面标注）
const DEEP_REL = {
  "c52": ["c71"],   // 李志仁的怀表（可深入） -> 揭开照片是德王
  "c58": ["c72"]    // 案发现场（可深入唱机等） -> 唱机旋转扣缠铁丝
};

function uuid(){
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// 判定线索属于哪个框：timePlace=时间地点 / rumor=县城流言 / deep=深入线索
function guessGroup(c){
  if(c.group) return c.group;
  const n = c.belong_name || "";
  if(n === "深入线索") return "deep";
  if(n === "县城流言") return "rumor";
  return "timePlace";
}
function groupOf(c){
  return guessGroup(c);
}

// 统一补齐新增字段，兼容旧数据
function normalizeData(d){
  if(!d || typeof d !== "object") return d;
  d.roles = d.roles || [];
  d.rounds = d.rounds || {};
  d.clues = d.clues || {};
  d.dm_public_pool = d.dm_public_pool || [];
  d.draw_log = d.draw_log || {};
  for(const cid in d.clues){
    const c = d.clues[cid];
    c.group = guessGroup(c);
    if(c.can_deep === undefined) c.can_deep = !!DEEP_REL[cid];
    if(!Array.isArray(c.deep_ids)) c.deep_ids = (DEEP_REL[cid] || []).slice();
    if(c.claimed_by === undefined) c.claimed_by = null;
    if(c.img === undefined) c.img = "";
  }
  for(const rid in d.rounds){
    const r = d.rounds[rid];
    r.pool = (r.pool || []).filter(function(id){
      return d.clues[id] && groupOf(d.clues[id]) !== "deep";
    });
    if(typeof r.limit_time_place !== "number") r.limit_time_place = r.per_person_draw || 2;
    if(typeof r.limit_rumor !== "number") r.limit_rumor = 1;
    r.per_person_draw = r.limit_time_place + r.limit_rumor;
  }
  d._version = DATA_VERSION;
  return d;
}

function saveData(){
  if(isDm && roomCode){
    data._roomCode = roomCode;
    data._dmOwner = CLIENT_ID;
    data._dmHeartbeat = Date.now();
  }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  publishState();
}

function render(){
  const app = document.getElementById("app");
  if(viewMode === "switch"){
    const last = getLastRoom();
    let lastBlock = "";
    if(last){
      lastBlock = `<div class="section" style="border-color:#2b7cd3;background:#f7fbff;">
        <h3>上次的会话</h3>
        <p>房间 <b style="font-size:18px;color:#2b7cd3">${last.code}</b>　身份：${last.role === "dm" ? "DM" : "玩家"}</p>
        <button onclick="resumeLast()">继续上次这个房间</button>
      </div>`;
    }
    app.innerHTML = `
      <h2>剧本杀线索工具</h2>
      ${lastBlock}
      <div class="section">
        <h3>我是玩家</h3>
        <input id="roomInput" placeholder="输入DM给你的房间号">
        <button onclick="joinRoom()">加入房间</button>
      </div>
      <div class="section">
        <h3>我是DM</h3>
        <button onclick="createRoom()">创建新房间</button>
        <p class="tip">不小心关掉页面？用原来的房间号重新进来，进度都在：</p>
        <input id="dmRoomInput" placeholder="输入已有房间号">
        <button class="gray" onclick="rejoinAsDm()">用房间号进入DM后台</button>
      </div>
      <p class="tip">需要联网，多设备自动同步</p>
    `;
    return;
  }
  if(viewMode === "room"){
    app.innerHTML = `
      <h2>连接中...</h2>
      <div class="section">
        <p>房间号：<b>${roomCode}</b></p>
        <p id="connStatus">正在连接服务器...</p>
        <button onclick="disconnectRoom()">退出房间</button>
      </div>
    `;
    return;
  }
  if(viewMode === "dm"){
    renderDM();
    return;
  }
  if(viewMode === "player"){
    renderPlayer();
    return;
  }
}
function switchView(mode){
  viewMode = mode;
  render();
}

// ===== MQTT 房间同步 =====
function clearClaims(){
  for(const cid in data.clues){ data.clues[cid].claimed_by = null; }
  data.dm_public_pool = [];
}
function createRoom(){
  if(!confirm("创建新房间会清空本局的选卡记录和深入线索发放记录（线索库、角色、轮次配置都保留）。\n\n如果你只是想回到之前那个房间，请关掉这个提示后用「用房间号进入DM后台」。\n\n确定创建新房间？")) return;
  roomCode = genRoomCode();
  isDm = true;
  dmConflict = false;
  clearClaims();
  data._roomCode = roomCode;
  saveData();
  rememberRoom("dm");
  connectRoom(true);
}
function joinRoom(){
  const v = document.getElementById("roomInput").value.trim().toUpperCase();
  if(!v) return alert("请输入房间号");
  roomCode = v;
  isDm = false;
  dmConflict = false;
  rememberRoom("player");
  connectRoom(false);
}
function rejoinAsDm(){
  const el = document.getElementById("dmRoomInput");
  const v = (el ? el.value : "").trim().toUpperCase();
  if(!v) return alert("请输入房间号");
  roomCode = v;
  isDm = true;
  dmConflict = false;
  rememberRoom("dm");
  connectRoom(true);
}
function resumeLast(){
  const last = getLastRoom();
  if(!last) return alert("没有上次的房间记录");
  roomCode = last.code;
  isDm = (last.role === "dm");
  dmConflict = false;
  if(!isDm){
    const saved = getPlayerRole();
    currentRole = data.roles.includes(saved) ? saved : "";
  }
  connectRoom(isDm);
}
function connectRoom(isHost){
  isDm = !!isHost;
  viewMode = "room";
  gotRemote = false;
  render();
  mqttTopic = "clue_game_" + roomCode;
  if(mqttClient){
    try{ mqttClient.end(true); }catch(e){}
    mqttClient = null;
  }
  try{
    mqttClient = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      connectTimeout: 5000,
      reconnectPeriod: 3000
    });
  }catch(e){
    const el = document.getElementById("connStatus");
    if(el) el.innerHTML = "<span style='color:red'>连接失败：" + e.message + "</span>";
    return;
  }
  mqttClient.on("connect", function(){
    const el = document.getElementById("connStatus");
    if(el) el.innerHTML = "✅ 已连接，正在同步数据...";
    mqttClient.subscribe(mqttTopic, {qos: 0});
    if(isHost){
      // DM：先给云端的保留消息 1.5 秒机会，拿到就用云端的；拿不到再用本地数据顶上
      setTimeout(function(){
        if(gotRemote) return;
        if(viewMode !== "room" && viewMode !== "dm") return;
        const localRoom = data._roomCode || "";
        if(localRoom && localRoom !== roomCode){
          const useHere = confirm("云端没有找到房间 " + roomCode + " 的数据。\n\n当前线索库来自上一次的房间 " + localRoom + "。\n要用这套线索在这个房间新开一局吗？（选卡记录会清空）");
          if(!useHere){ disconnectRoom(); return; }
          clearClaims();
        }
        saveData();
        if(viewMode === "room") switchView("dm");
      }, 1500);
    }else{
      // 玩家：连上就先进界面，不必等 DM 的保留消息
      switchView("player");
    }
  });
  mqttClient.on("message", function(topic, payload){
    try{
      const remote = JSON.parse(payload.toString());
      gotRemote = true;
      if(isSyncing) return;
      isSyncing = true;
      data = normalizeData(remote);
      if(isDm && remote._dmOwner && remote._dmOwner !== CLIENT_ID &&
         (Date.now() - (remote._dmHeartbeat || 0) < 120000)){
        dmConflict = true;
      }
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
      if(viewMode === "room"){
        if(isHost){ switchView("dm"); }
        else{ switchView("player"); }
      }else{
        render();
      }
      setTimeout(function(){ isSyncing = false; }, 500);
    }catch(e){}
  });
  mqttClient.on("error", function(err){
    const el = document.getElementById("connStatus");
    if(el) el.innerHTML = "<span style='color:red'>连接错误：" + err.message + "</span>";
  });
  // 超时提示，带重试
  setTimeout(function(){
    if(viewMode === "room"){
      const el = document.getElementById("connStatus");
      if(!el) return;
      const h = isHost ? "true" : "false";
      el.innerHTML = "<span style='color:red'>连接超时，可能网络受限（公共服务器偶尔抽风）。</span><br>" +
        "<button onclick='connectRoom(" + h + ")'>重试连接</button>" +
        " <button class='gray' onclick=\"switchView('player')\">先进入玩家界面</button>";
    }
  }, 8000);
}
function publishState(){
  if(mqttClient && mqttClient.connected){
    mqttClient.publish(mqttTopic, JSON.stringify(data), {retain: true, qos: 0});
  }
}
function disconnectRoom(){
  if(mqttClient) try{ mqttClient.end(); }catch(e){}
  mqttClient = null;
  isDm = false;
  dmConflict = false;
  gotRemote = false;
  viewMode = "switch";
  render();
}
function takeOverDm(){
  dmConflict = false;
  saveData();
  render();
  alert("已由本机接管，房间状态以本机为准");
}
function copyRoomCode(){
  const txt = roomCode;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(
        function(){ alert("房间号 " + txt + " 已复制"); },
        function(){ prompt("手动复制房间号：", txt); }
      );
      return;
    }
  }catch(e){}
  prompt("手动复制房间号：", txt);
}

// ========== DM面板 ==========
let detailCid = null; // 玩家当前展开查看的线索
function renderDM(){
  const app = document.getElementById("app");
  let html = `<h2>DM后台管理 <span style="font-size:14px;color:#2b7cd3;font-weight:normal;">房间 ${roomCode}</span></h2>
  <button onclick="switchView('switch')">返回身份选择</button>`;
  if(dmConflict){
    html += `<div class="section" style="border-color:#dc3545;background:#fff5f5;">
      <p style="color:#dc3545;margin:0 0 6px;">⚠️ 这个房间可能有另一台设备也在用 DM 后台，两边同时操作会互相覆盖。</p>
      <button class="danger" onclick="takeOverDm()">由我这台设备接管</button>
    </div>`;
  }
  html += `<div class="section">
    <h3>1.角色管理</h3>
    <input id="newRoleInput" placeholder="输入角色名">
    <button onclick="addRole()">添加角色</button>
    <div>`;
  for(const r of data.roles){
    html += `<span>${r}</span> <button class="danger" onclick="delRole('${r}')">删除</button> `;
  }
  html += `</div></div>

  <div class="section">
    <h3>2.轮次管理</h3>
    <input id="roundIdInput" placeholder="轮次编号，如1、2">
    <p class="tip">📍 时间/地点框 每人上限（条）</p>
    <input id="roundTpLimitInput" type="number" value="2">
    <p class="tip">🗣️ 县城流言框 每人上限（条）</p>
    <input id="roundRumorLimitInput" type="number" value="1">
    <button onclick="addRound()">新建轮次</button>
    <h4>轮次列表</h4>`;
  for(const rid in data.rounds){
    const r = data.rounds[rid];
    const pool = r.pool || [];
    let cTp = 0, cRm = 0;
    for(const cid of pool){
      const c = data.clues[cid];
      if(!c || !c.claimed_by) continue;
      if(groupOf(c) === "rumor") cRm++; else cTp++;
    }
    const tpTotal = pool.filter(cid=>data.clues[cid] && groupOf(data.clues[cid])!=="rumor").length;
    const rmTotal = pool.length - tpTotal;
    html += `<div class="card">
      第${rid}轮｜${r.open ? "✅已开启" : "❌关闭"}<br>
      📍时间地点 每人${r.limit_time_place}条（已选${cTp}/${tpTotal}）｜🗣️县城流言 每人${r.limit_rumor}条（已选${cRm}/${rmTotal}）
      <br>
      <button onclick="toggleRound('${rid}')">开启/关闭</button>
      <button onclick="editRoundLimit('${rid}')">修改配额</button>
      <button onclick="editRoundPool('${rid}')">配置线索池</button>
      <button class="danger" onclick="delRound('${rid}')">删除轮次</button>
    </div>`;
  }
  html += `</div>`;

  if(currentEditRoundId){
    const rid = currentEditRoundId;
    const pool = data.rounds[rid].pool || [];
    const tpCount = pool.filter(cid=>data.clues[cid] && groupOf(data.clues[cid])!=="rumor").length;
    const rmCount = pool.length - tpCount;
    html += `<div class="section">
      <h3>配置【第${rid}轮】线索池（点击勾选）</h3>
      <p>已勾选：${pool.length} 条（📍时间地点 ${tpCount} 条｜🗣️县城流言 ${rmCount} 条）</p>
      <p class="tip">深入线索不可放入线索池，由DM单独发放。</p>`;
    for(const cid in data.clues){
      const c = data.clues[cid];
      const g = groupOf(c);
      if(g === "deep") continue;
      const checked = pool.includes(cid);
      html += `<div class="card ${checked?'selected':''}" onclick="togglePoolItem('${rid}','${cid}')">
        <span class="belong-tag">${c.belong_type==='role'?'角色':'地点'}：${c.belong_name}</span>
        <span class="badge ${g==='rumor'?'warn':''}">${g==='rumor'?'🗣️流言':'📍时地'}</span>
        ${c.can_deep?'<span class="badge deep-badge">可深入</span>':''}
        <p>${c.desc}</p>
      </div>`;
    }
    html += `<button onclick="currentEditRoundId=null;render()">保存并关闭</button></div>`;
  }

  // 本轮选卡状态总览
  for(const rid in data.rounds){
    const r = data.rounds[rid];
    if(!r.open) continue;
    const pool = r.pool || [];
    const tpIds = pool.filter(cid=>data.clues[cid] && groupOf(data.clues[cid])!=="rumor");
    const rmIds = pool.filter(cid=>data.clues[cid] && groupOf(data.clues[cid])==="rumor");
    html += `<div class="section">
      <h3>第${rid}轮 · 选卡状态总览</h3>`;
    html += dmStatusList(tpIds, "📍 时间 &amp; 地点");
    html += dmStatusList(rmIds, "🗣️ 县城流言");
    html += `</div>`;
  }

  // 深入线索发放总控
  html += `<div class="section">
    <h3>深入线索（不可直接抽取，仅DM发放）</h3>`;
  const deepAll = Object.keys(data.clues).filter(id=>groupOf(data.clues[id])==="deep");
  if(!deepAll.length) html += `<p class="tip">暂无深入线索</p>`;
  for(const did of deepAll){
    const d = data.clues[did];
    html += `<div class="card ${d.claimed_by?'selected':''}">
      <span class="badge deep-badge">深入</span>
      <span style="margin-left:8px;color:${d.claimed_by?'#2b7cd3':'#999'}">${d.claimed_by?('已发放给 '+d.claimed_by):'未发放'}</span>
      <p>${d.desc}</p>
      ${d.claimed_by?`<button class="gray" onclick="unclaimClue('${did}')">撤回</button>`:''}
    </div>`;
  }
  html += `<p class="tip">当玩家抽到牌面标注「可深入」的线索时，在上方总览里点「发放」给他。</p></div>`;

  html += `
  <div class="section">
    <h3>3.录入新线索</h3>
    <select id="belongType">
      <option value="role">角色</option>
      <option value="location">地点</option>
    </select>
    <input id="belongName" placeholder="归属名称，如 张三 / 书房">
    <select id="clueGroup">
      <option value="timePlace">📍 时间/地点框（玩家可选）</option>
      <option value="rumor">🗣️ 县城流言框（玩家可选）</option>
      <option value="deep">✨ 深入线索（仅DM发放）</option>
    </select>
    <textarea id="clueDesc" placeholder="线索文字描述"></textarea>
    <label><input type="checkbox" id="canPublicCheck" checked>允许申请公开</label>
    <label><input type="checkbox" id="canDeepCheck">牌面标注「可深入」</label>
    <br>
    <button onclick="uploadClue()">添加线索</button>
  </div>

  <div class="section">
    <h3>4.公共线索池</h3>`;
  for(const cid of data.dm_public_pool){
    const c = data.clues[cid];
    if(!c) continue;
    html += `<div class="card">
      <span class="belong-tag">${c.belong_type==='role'?'角色':'地点'}：${c.belong_name}</span>
      <p>${c.desc}</p>
      <button class="danger" onclick="removePublic('${cid}')">撤回</button>
    </div>`;
  }
  html += `<p class="tip">玩家申请公开后，你在这里手动加入</p></div>

  <div class="section">
    <h3>5.房间信息</h3>
    <p>房间号：<b style="font-size:22px;color:#2b7cd3">${roomCode}</b></p>
    <button class="gray" onclick="copyRoomCode()">复制房间号</button>
    <p class="tip">把这个房间号告诉玩家，他们在自己手机上打开本文件，输入房间号即可加入。所有选卡自动同步。</p>
    <div style="background:#f7fbff;border:1px solid #b9d8f5;border-radius:8px;padding:10px;margin-top:8px;">
      <p style="margin:0 0 6px;color:#2b7cd3;font-weight:bold;">DM 掉线了怎么办？</p>
      <p class="tip" style="margin:0;">重新打开本文件，在首页选「用房间号进入DM后台」，输入 <b>${roomCode}</b>，就能接着控场 —— 选卡记录、谁拿了哪条、深入线索发放情况都还在。</p>
    </div>
    <button class="gray" onclick="disconnectRoom()">退出房间</button>
  </div>

  <div class="section">
    <h3>6.本局重置</h3>
    <button class="danger" onclick="resetGame()">重置本局（清空所有选卡记录+公共线索，保留素材和轮次）</button>
  </div>`;
  app.innerHTML = html;
}

function addRole(){
  const el = document.getElementById("newRoleInput");
  const name = el.value.trim();
  if(!name || data.roles.includes(name)) return alert("角色名不能为空或重复");
  data.roles.push(name);
  saveData(); render();
}
function delRole(name){
  if(!confirm("确定删除？")) return;
  data.roles = data.roles.filter(x=>x!==name);
  saveData(); render();
}
function addRound(){
  const rid = document.getElementById("roundIdInput").value.trim();
  const tp = parseInt(document.getElementById("roundTpLimitInput").value);
  const rm = parseInt(document.getElementById("roundRumorLimitInput").value);
  if(!rid) return alert("轮次编号必填");
  if(isNaN(tp) || tp < 0 || isNaN(rm) || rm < 0) return alert("两个上限都必须填 0 或正整数");
  if(data.rounds[rid]) return alert("该轮次已存在");
  data.rounds[rid] = {open:false, limit_time_place:tp, limit_rumor:rm, per_person_draw:tp+rm, pool:[]};
  saveData(); render();
}
function toggleRound(rid){
  data.rounds[rid].open = !data.rounds[rid].open;
  saveData(); render();
}
function editRoundLimit(rid){
  const r = data.rounds[rid];
  const v1 = prompt("第" + rid + "轮 · 📍时间/地点框 每人最多选几条\n（当前：" + r.limit_time_place + "）", r.limit_time_place);
  if(v1 === null) return;
  const n1 = parseInt(v1);
  if(isNaN(n1) || n1 < 0) return alert("请输入 0 或正整数");
  const v2 = prompt("第" + rid + "轮 · 🗣️县城流言框 每人最多选几条\n（当前：" + r.limit_rumor + "）", r.limit_rumor);
  if(v2 === null) return;
  const n2 = parseInt(v2);
  if(isNaN(n2) || n2 < 0) return alert("请输入 0 或正整数");
  r.limit_time_place = n1;
  r.limit_rumor = n2;
  r.per_person_draw = n1 + n2;
  saveData(); render();
}
function delRound(rid){
  if(!confirm("确定删除该轮次？")) return;
  delete data.rounds[rid];
  saveData(); render();
}
function editRoundPool(rid){
  currentEditRoundId = rid;
  render();
}
function togglePoolItem(rid, cid){
  const c = data.clues[cid];
  if(c && groupOf(c) === "deep") return alert("深入线索不能放入线索池，请在总览里单独发放");
  const pool = data.rounds[rid].pool || [];
  const idx = pool.indexOf(cid);
  if(idx>=0) pool.splice(idx,1);
  else pool.push(cid);
  data.rounds[rid].pool = pool;
  saveData(); render();
}
function uploadClue(){
  const type = document.getElementById("belongType").value;
  const bname = document.getElementById("belongName").value.trim();
  const group = document.getElementById("clueGroup").value;
  const desc = document.getElementById("clueDesc").value.trim();
  const canPub = document.getElementById("canPublicCheck").checked;
  const canDeep = document.getElementById("canDeepCheck").checked;
  if(!bname || !desc) return alert("归属名称、线索描述必填");
  const cid = uuid();
  data.clues[cid] = {
    belong_type: type,
    belong_name: bname,
    group: group,
    desc: desc,
    img: "",
    can_public: canPub,
    can_deep: (group === "deep") ? false : canDeep,
    deep_ids: [],
    claimed_by: null
  };
  saveData(); render();
}
function delClue(cid){
  if(!confirm("删除这条线索？")) return;
  delete data.clues[cid];
  for(const r in data.rounds){
    const p = data.rounds[r].pool;
    const i = p.indexOf(cid);
    if(i>=0) p.splice(i,1);
  }
  const pi = data.dm_public_pool.indexOf(cid);
  if(pi>=0) data.dm_public_pool.splice(pi,1);
  saveData(); render();
}
function removePublic(cid){
  const i = data.dm_public_pool.indexOf(cid);
  if(i>=0) data.dm_public_pool.splice(i,1);
  saveData(); render();
}
function unclaimClue(cid){
  const c = data.clues[cid];
  if(!c) return;
  const owner = c.claimed_by;
  c.claimed_by = null;
  // 如果是基础线索，连带撤回已发给同一人的深入线索
  if(owner && groupOf(c) !== "deep"){
    const ids = (c.deep_ids && c.deep_ids.length) ? c.deep_ids : [];
    for(const did of ids){
      const d = data.clues[did];
      if(d && d.claimed_by === owner) d.claimed_by = null;
    }
  }
  saveData(); render();
}
function giveDeep(deepId, role){
  const d = data.clues[deepId];
  if(!d) return alert("深入线索不存在");
  if(d.claimed_by) return alert("这条深入线索已发放给 " + d.claimed_by);
  if(!role) return alert("没有指定玩家");
  d.claimed_by = role;
  saveData(); render();
  alert("已把深入线索发放给 " + role);
}
function deepCandidates(c){
  const all = Object.keys(data.clues).filter(function(id){ return groupOf(data.clues[id]) === "deep"; });
  const ids = (c.deep_ids && c.deep_ids.length) ? c.deep_ids.slice() : all;
  return ids.filter(function(id){ return data.clues[id] && !data.clues[id].claimed_by; });
}
function dmStatusList(ids, title){
  const isRumor = title.indexOf("流言") >= 0;
  let h = `<div class="group-box ${isRumor?'rumor':'timeplace'}"><h4><span>${title}</span><span class="badge ${isRumor?'warn':''}">共${ids.length}条</span></h4>`;
  if(!ids.length) h += `<p class="tip">本轮此框暂无线索</p>`;
  for(const cid of ids){
    const c = data.clues[cid];
    if(!c) continue;
    const who = c.claimed_by;
    h += `<div class="card">
      <span class="belong-tag">${c.belong_type==='role'?'角色':'地点'}：${c.belong_name}</span>
      ${c.can_deep?'<span class="badge deep-badge">可深入</span>':''}
      <span style="margin-left:8px;color:${who?'#2b7cd3':'#999'}">→ ${who||'未被选'}</span>
      <p>${c.desc}</p>
      ${who?`<button class="gray" onclick="unclaimClue('${cid}')">撤回这条</button>`:''}`;
    if(who && c.can_deep){
      const cand = deepCandidates(c);
      h += `<div style="background:#f3edff;padding:8px;border-radius:6px;margin-top:6px;">
        <p class="tip" style="margin:0 0 6px;">🎁 牌面可深入 → 给 ${who} 发放深入线索</p>`;
      if(!cand.length) h += `<p class="tip" style="color:#999">暂无可用深入线索</p>`;
      for(const did of cand){
        const d = data.clues[did];
        h += `<button onclick="giveDeep('${did}','${who}')">发放：${d.desc.slice(0,16)}${d.desc.length>16?'…':''}</button>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}
function resetGame(){
  if(!confirm("确认重置本局？清空所有选卡记录、深入线索发放记录和公共线索！")) return;
  for(const cid in data.clues){
    data.clues[cid].claimed_by = null;
  }
  data.dm_public_pool = [];
  saveData(); render();
}

// ========== 玩家面板 ==========
function groupBoxHTML(rid, ids, g, myCount, limit){
  const isRumor = (g === "rumor");
  const title = isRumor ? "🗣️ 县城流言" : "📍 时间 &amp; 地点";
  const badgeCls = (limit === 0 || myCount >= limit) ? "full" : (isRumor ? "warn" : "");
  let h = `<div class="group-box ${isRumor?'rumor':'timeplace'}">
    <h4><span>${title}</span><span class="badge ${badgeCls}">已选 ${myCount} / ${limit}</span></h4>`;
  if(limit === 0) h += `<p class="tip">本轮此框DM未开放</p>`;
  else if(!ids.length) h += `<p class="tip">本轮此框暂无线索</p>`;
  for(const cid of ids){
    const c = data.clues[cid];
    if(!c) continue;
    const claimed = c.claimed_by;
    const label = (c.belong_type==='role'?'角色':'地点') + '：' + c.belong_name;
    if(claimed === currentRole){
      h += `<div class="card selected">
        <span class="belong-tag">${label}</span>${c.can_deep?'<span class="badge deep-badge">可深入</span>':''}
        <p>${c.desc}</p>
        ${c.can_deep?'<p class="tip">✨ 牌面标注可深入，等待DM发放深入线索</p>':''}
        ${c.can_public?`<button onclick="alert('请口头告诉DM：我申请公开这条线索')">申请公开</button>`:''}
      </div>`;
    }else if(claimed){
      h += `<div class="card" style="opacity:0.4">
        <span class="belong-tag">${label}</span>
        <p class="tip">🔒 已被选走</p>
      </div>`;
    }else if(limit === 0 || myCount >= limit){
      h += `<div class="card" style="opacity:0.45">
        <span class="belong-tag">${label}</span>
        <p class="tip">本框配额已满</p>
      </div>`;
    }else{
      h += `<div class="card" onclick="chooseClue('${rid}','${cid}')">
        <span class="belong-tag">${label}</span>
        <p class="tip">👆 点击选择这条线索</p>
      </div>`;
    }
  }
  h += `</div>`;
  return h;
}

function renderPlayer(){
  const app = document.getElementById("app");
  let html = `<h2>玩家界面 <span style="font-size:14px;color:#2b7cd3;font-weight:normal;">房间 ${roomCode}</span></h2>
  <button onclick="switchView('switch')">返回身份选择</button>`;
  if(!currentRole){
    html += `<div class="section">
      <p>选择你的角色</p>
      <select id="roleSelect">`;
    for(const r of data.roles) html += `<option value="${r}">${r}</option>`;
    html += `</select>
      <button onclick="setRole()">确认进入</button>
    </div>`;
  }else{
    html += `<div class="section"><h3>你：${currentRole}</h3>
    <button onclick="switchPlayerRole()">切换角色</button>
    </div>

    <div class="section">
      <h3>【公共线索】</h3>`;
    for(const cid of data.dm_public_pool){
      const c = data.clues[cid];
      if(!c) continue;
      html += `<div class="card">
        <span class="belong-tag">${c.belong_type==='role'?'角色':'地点'}：${c.belong_name}</span>
        <p>${c.desc}</p>
      </div>`;
    }
    html += `</div>`;

    // 本轮搜证：两个独立框
    for(const rid in data.rounds){
      const r = data.rounds[rid];
      if(!r.open) continue;
      const pool = r.pool || [];
      const tpIds = pool.filter(cid=>data.clues[cid] && groupOf(data.clues[cid])!=="rumor");
      const rmIds = pool.filter(cid=>data.clues[cid] && groupOf(data.clues[cid])==="rumor");
      let myTp = 0, myRm = 0;
      for(const cid of tpIds){ if(data.clues[cid].claimed_by === currentRole) myTp++; }
      for(const cid of rmIds){ if(data.clues[cid].claimed_by === currentRole) myRm++; }
      html += `<div class="section">
        <h3>【第${rid}轮 · 搜证】</h3>
        <p class="tip">点一下就选走，选中后才显示内容；同一归属可能有多条不同线索。</p>`;
      html += groupBoxHTML(rid, tpIds, "timePlace", myTp, r.limit_time_place);
      html += groupBoxHTML(rid, rmIds, "rumor", myRm, r.limit_rumor);
      html += `</div>`;
    }

    // 我的基础证据
    html += `<div class="section">
      <h3>【我的证据】</h3>`;
    let hasAny = false;
    for(const cid in data.clues){
      const c = data.clues[cid];
      if(!c || c.claimed_by !== currentRole) continue;
      if(groupOf(c) === "deep") continue;
      hasAny = true;
      html += `<div class="card">
        <span class="belong-tag">${c.belong_type==='role'?'角色':'地点'}：${c.belong_name}</span>
        ${c.can_deep?'<span class="badge deep-badge">可深入</span>':''}
        <p>${c.desc}</p>
      </div>`;
    }
    if(!hasAny) html += `<p class="tip">还没有选到证据</p>`;
    html += `</div>`;

    // 我的深入线索
    html += `<div class="section">
      <h3>✨【我的深入线索】</h3>`;
    let hasDeep = false;
    for(const cid in data.clues){
      const c = data.clues[cid];
      if(!c || c.claimed_by !== currentRole) continue;
      if(groupOf(c) !== "deep") continue;
      hasDeep = true;
      html += `<div class="card selected">
        <span class="badge deep-badge">深入</span>
        <p>${c.desc}</p>
      </div>`;
    }
    if(!hasDeep) html += `<p class="tip">DM还没给你发放深入线索</p>`;
    html += `</div>`;
  }
  app.innerHTML = html;
}
function setRole(){
  const sel = document.getElementById("roleSelect");
  currentRole = sel.value;
  savePlayerRole(currentRole);
  detailCid = null;
  render();
}
function switchPlayerRole(){
  currentRole = "";
  savePlayerRole("");
  render();
}
function chooseClue(rid, cid){
  const r = data.rounds[rid];
  const c = data.clues[cid];
  if(!r || !c) return;
  const g = groupOf(c);
  if(g === "deep") return alert("深入线索不能直接抽取，由DM发放");
  if(c.claimed_by) return alert("这条已被选走了");
  if(!(r.pool || []).includes(cid)) return alert("这条不在本轮线索池");
  let used = 0;
  for(const id of r.pool){
    const cc = data.clues[id];
    if(cc && cc.claimed_by === currentRole && groupOf(cc) === g) used++;
  }
  const limit = (g === "rumor") ? r.limit_rumor : r.limit_time_place;
  if(limit === 0) return alert("本轮此框DM未开放抽取");
  if(used >= limit) return alert(g === "rumor" ? "本轮县城流言框的选择次数已用完" : "本轮时间地点框的选择次数已用完");
  c.claimed_by = currentRole;
  detailCid = null;
  saveData(); render();
}

let data = loadData();
render();
</script>
</body>
</html>
